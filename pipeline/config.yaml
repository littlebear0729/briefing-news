# ---------------------------------------------------------------------------
# Artefacts and layout.
#
# The deliverable is ONE responsive HTML file. There is no fixed page box and no PDF:
# "two pages" is a length target (target_sheets) that preflight checks against the
# estimated rendered length, not a layout constraint that clips content.
# ---------------------------------------------------------------------------
paths:
  build_dir: "build"
  dist_dir: "dist"
  template_dir: "templates"
  asset_dir: "assets"
  state_dir: "state"

layout:
  template: "newspaper.html.j2"        # responsive: phone, laptop, and print
  footer_text: "THE GLOBAL BRIEF | WIRE EDITION"
  sheets: 2                            # number of sheet sections the template renders
  target_sheets: 2.0                   # length target, in A4-sheet equivalents
  # Measured, not guessed: the committed fixture (1 011 words, 13 stories) prints to
  # exactly two A4 pages, and the worst case allowed by budgets prints to three. The
  # band accepts both and rejects an edition that is half or double the brief.
  length_tolerance: 0.7
  max_document_bytes: 52428800         # Telegram sendDocument limit: 50 MB
  edition_epoch: "2026-01-01"          # edition numbering anchor (issue #1 = AM of this date)

# ---------------------------------------------------------------------------
# Delivery.
# ---------------------------------------------------------------------------
telegram:
  api_base: "https://api.telegram.org"
  caption_max_chars: 1024
  caption_parse_mode: "HTML"
  filename_template: "The-Global-Brief-{date}-{edition}.html"
  send_delay_seconds: 0.6              # serial + sleeping between documents
  max_retries: 3
  chat_ids: []                         # usually supplied by env TELEGRAM_CHAT_ID
