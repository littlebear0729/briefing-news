# The Global Brief — pipeline configuration.
#
# Everything stable lives here. The LLM never sees this file: it receives only a
# candidate pool (ids + titles + summaries) and returns editorial JSON with
# source_ids. Feeds, time windows, caps and budgets are code-owned (DESIGN.md §3).

# ---------------------------------------------------------------------------
# Editions: a UTC cutoff per edition. The candidate window is
#   (cutoff - lookback_hours, cutoff]  and is applied in fetch.py.
# Cron in the workflow fires a few minutes before each cutoff.
# ---------------------------------------------------------------------------
editions:
  AM:
    label: "Morning Edition"
    cutoff_utc: "01:15"
  PM:
    label: "Evening Edition"
    cutoff_utc: "13:15"

lookback_hours: 12          # window length; per-edition override allowed below

# ---------------------------------------------------------------------------
# Budgets — enforced in code (_enforce_budgets), never trusted to the prompt.
# The prompt is merely told about them so the first attempt is usually close.
#
# These maxima are CALIBRATED, not guessed: they are the largest values whose
# worst case (every paragraph at its word limit, every list at its maximum
# length) still prints to exactly two A4 pages with the fixed footer on both.
# tests/test_layout.py builds that worst-case edition, and tests/test_print.py
# prints it in a real browser when one is available. Raising a number here
# without re-running those tests is how a page starts silently clipping.
# ---------------------------------------------------------------------------
budgets:
  section_cap: 12           # hard cap of candidates per section (fetch.py)
  lead_paras: 4             # the front-page lead only
  lead_words: 44            # per paragraph
  story_paras: 2            # every other story, including money.lead and sport.lead
  story_words: 26           # per paragraph
  brief_count_min: 3
  brief_count_max: 4
  brief_words: 24
  bullet_words: 16
  headline_words: 8
  kicker_words: 4
  deck_words: 12
  dateline_words: 5
  summary_chars: 800        # RSS summaries are untrusted input; truncated

# ---------------------------------------------------------------------------
# Model endpoint. Every value can be overridden by environment variables
# (BRIEF_LLM_BASE_URL / BRIEF_LLM_MODEL / BRIEF_LLM_RETRIES /
#  BRIEF_LLM_TEMPERATURE). An EMPTY env value falls back to the default here.
# Exactly ONE LLM call per edition feeds both the print and the mobile artefact.
# ---------------------------------------------------------------------------
model:
  base_url: "https://api.deepseek.com/v1"
  name: "deepseek/deepseek-v4-flash"
  retries: 3
  temperature: 0.1          # CI stays at 0-0.2; editorial calls are not creative writing
  timeout_seconds: 120
  json_mode: true           # ask for a JSON object response
  max_summary_chars_in_prompt: 600

# ---------------------------------------------------------------------------
# Candidate pool. Only whitelisted domains survive fetch.py (sources.py is the
# gate; render.py re-checks before rendering).
#
# Every URL below was verified live on 2026-10-13: HTTP 200, parses as XML, and carries
# entries. Feeds rot silently, which is why the pipeline warns per empty section rather
# than quietly printing a thinner paper. More feeds per section also means a flaky or
# blocking publisher cannot empty a section on its own.
#
# Known dead ends, verified the same day — do not "fix" these by guessing:
#   * Reuters has discontinued public RSS (all /arc/outboundfeeds and feeds.reuters.com
#     endpoints return 404 or fail TLS). reuters.com stays whitelisted for citation.
#   * AP (Cloudflare 403), Politico (403), OECD (403), IMF (403/429) and ATP Tour (403)
#     block non-browser clients; BIS and The Art Newspaper feeds are 404.
#   * UEFA and The Olympics return HTML, not feeds.
# ---------------------------------------------------------------------------
section_titles:
  geopolitics: "Geopolitics"
  tech: "Technology"
  finance: "Markets & Finance"
  sport: "Sport"
  entertainment: "Culture"

